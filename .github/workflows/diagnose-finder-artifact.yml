name: Inspect failed Finder test diagnostics

on:
  push:
    branches:
      - fix/gtk4-macos-bundle-artifact
    paths:
      - .github/workflows/diagnose-finder-artifact.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnostics:
    if: github.repository == 'copystring/gnucash-on-osx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-gtk4-bundle-preflight
          run-id: '35997464469'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostics
      - name: Report Finder test logs
        shell: bash
        run: |
          set -euo pipefail
          find diagnostics -type f -print
          while IFS= read -r -d '' log; do
            case "$log" in
              *finder-open*.log)
                printf 'Log: %s\n' "$log"
                while IFS= read -r line; do
                  printf '::error title=Finder diagnostic::%s\n' "$line"
                done < <(tail -n 35 "$log")
                ;;
            esac
          done < <(find diagnostics -type f -print0)

  cli-control:
    if: github.repository == 'copystring/gnucash-on-osx'
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          repository: copystring/gnucash
          ref: 3eadf7eb4437e16789dcb2a57edb5c4a42e1253b
          path: core
          sparse-checkout: libgnucash/backend/xml/test/test-files/load-save
      - uses: actions/download-artifact@v4
        with:
          name: macos-gtk4-app-bundle
          run-id: '35929285598'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: app-artifact
      - name: Check isolated history with a direct CLI book open
        shell: bash
        run: |
          set -euo pipefail
          ditto -x -k app-artifact/gnucash-gtk4-macos-app.zip "$RUNNER_TEMP/cli-control-app"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time

          root = Path(os.environ["RUNNER_TEMP"]) / "gnucash-cli-control"
          app = Path(os.environ["RUNNER_TEMP"]) / "cli-control-app/Gnucash.app"
          executable = app / "Contents/MacOS/Gnucash"
          source = Path("core/libgnucash/backend/xml/test/test-files/load-save/sample1.gnucash")
          book = root / "cli-book.gnucash"
          root.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, book)
          schemas = list(app.glob("Contents/Resources/**/gschemas.compiled"))
          if not executable.is_file() or len(schemas) != 1:
              raise RuntimeError(f"bundle executable/schema mismatch: {len(schemas)}")
          env = os.environ.copy()
          for name in ("home", "config", "data", "cache", "gnc-config", "gnc-data"):
              (root / name).mkdir(exist_ok=True)
          env.update(HOME=str(root / "home"), XDG_CONFIG_HOME=str(root / "config"),
                     XDG_DATA_HOME=str(root / "data"), XDG_CACHE_HOME=str(root / "cache"),
                     GNC_CONFIG_HOME=str(root / "gnc-config"),
                     GNC_DATA_HOME=str(root / "gnc-data"), GSETTINGS_BACKEND="keyfile",
                     GSETTINGS_SCHEMA_DIR=str(schemas[0].parent))
          subprocess.run(["gsettings", "set", "org.gnucash.GnuCash.dialogs.new-user",
                          "first-startup", "false"], env=env, check=True)
          stderr_path = root / "cli.stderr.log"
          with stderr_path.open("w") as stderr:
              process = subprocess.Popen([str(executable), str(book)], env=env,
                                         stdout=stderr, stderr=stderr)
              try:
                  deadline = time.monotonic() + 90
                  while time.monotonic() < deadline:
                      value = subprocess.run(
                          ["gsettings", "get", "org.gnucash.GnuCash.history", "file0"],
                          env=env, capture_output=True, text=True, check=True).stdout.strip()
                      if str(book) in value:
                          print(f"CLI control opened book: {value}")
                          break
                      if process.poll() is not None:
                          raise RuntimeError(f"app exited: {process.returncode}; history={value}")
                      time.sleep(0.5)
                  else:
                      raise RuntimeError(f"CLI control timed out; history={value}")
              except Exception as error:
                  diagnostic = stderr_path.read_text(errors="replace")[-1500:]
                  print(f"::error title=CLI control::{error}; stderr={diagnostic!r}")
                  raise
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=10)
          PY
