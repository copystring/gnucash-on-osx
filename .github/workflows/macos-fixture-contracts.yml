name: macos-fixture-contracts

on:
  pull_request:
    paths:
      - depstarball.sh
      - dependencies-gtk4.txt
      - gnucash-bundler/Info-unstable.plist
      - verify-macos-app-bundle.sh
      - macos-bundle-metadata.py
      - modulesets/gnucash.modules
      - modulesets/generate-docs-overlay.py
      - jhbuildrc-custom
      - verify-jhbuild-deployment-target.sh
      - verify-jhbuild-prefix.sh
      - tests/test-depstarball-bundle-inputs.sh
      - tests/test-depstarball-icon-themes.sh
      - tests/test-generate-docs-overlay.py
      - tests/test-macos-bundle-metadata.py
      - tests/test-verify-jhbuild-deployment-target.sh
      - tests/test-verify-jhbuild-prefix.sh
      - tests/test-verify-macos-app-bundle.sh
      - .github/workflows/gtk4-macos-dependencies.yml
      - .github/workflows/macos-gtk4-bundle-preflight.yml
      - .github/workflows/macos-fixture-contracts.yml
  push:
    branches:
      - feature/**
      - fix/**
    paths:
      - depstarball.sh
      - dependencies-gtk4.txt
      - gnucash-bundler/Info-unstable.plist
      - verify-macos-app-bundle.sh
      - macos-bundle-metadata.py
      - modulesets/gnucash.modules
      - modulesets/generate-docs-overlay.py
      - jhbuildrc-custom
      - verify-jhbuild-deployment-target.sh
      - verify-jhbuild-prefix.sh
      - tests/test-depstarball-bundle-inputs.sh
      - tests/test-depstarball-icon-themes.sh
      - tests/test-generate-docs-overlay.py
      - tests/test-macos-bundle-metadata.py
      - tests/test-verify-jhbuild-deployment-target.sh
      - tests/test-verify-jhbuild-prefix.sh
      - tests/test-verify-macos-app-bundle.sh
      - .github/workflows/gtk4-macos-dependencies.yml
      - .github/workflows/macos-gtk4-bundle-preflight.yml
      - .github/workflows/macos-fixture-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contracts:
    name: Fixture contracts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Run archive and bundle fixtures
        run: |
          set -euo pipefail
          bash tests/test-depstarball-icon-themes.sh
          bash tests/test-depstarball-bundle-inputs.sh
          python3 tests/test-generate-docs-overlay.py
          python3 tests/test-macos-bundle-metadata.py
          bash tests/test-verify-jhbuild-deployment-target.sh
          bash tests/test-verify-jhbuild-prefix.sh
          bash tests/test-verify-macos-app-bundle.sh
