name: gtk4-macos-dependencies

on:
  push:
    branches:
      - feature/gtk4-dependencies
  workflow_dispatch:
    inputs:
      gnucash_repository:
        description: GnuCash repository to build
        required: true
      gnucash_ref:
        description: GnuCash branch, tag, or commit to build
        required: true
      gtk_refresh:
        description: Rebuild only GTK plus its archived-prefix build prerequisites
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      gnucash_repository:
        required: true
        type: string
      gnucash_ref:
        required: true
        type: string
      gtk_refresh:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build GTK4 dependencies and GnuCash
    runs-on: macos-26
    timeout-minutes: 350
    env:
      ROOT_DIR: /Users/runner/gnucash
      PREFIX: /Users/runner/gnucash
      JHBUILD: /Users/runner/.new_local/bin/jhbuild
      MODULESET: ${{ github.workspace }}/gnucash-on-osx/modulesets/gnucash.modules
      GTK_OSX_REF: 0889e034206c1019e408cff7e9f426fccd5e034e
      JHBUILD_REF: 16e05af9b58b9e7433ce7417ecd8915beba59133
      CARGO_C_URL: https://github.com/lu-zero/cargo-c/releases/download/v0.10.23/cargo-c-macos.zip
      CARGO_C_SHA256: 765041715fb8cb2b29ac87b161a8a77f1ba7bcad9868a051eda0abc4deb144ca
      GTEST_URL: https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
      GTEST_SHA256: 65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c
      REFRESH_BASE_RECIPE_REF: c144445a3e021a3743b70b46119533995c588bce
      REFRESH_BASE_URL: https://github.com/copystring/gnucash-on-osx/releases/download/gtk4-dependencies-20260906-c144445/gnucash-future-gtk4-mac-dependencies.tar.xz
      REFRESH_BASE_SHA256: 2938aed05574623ff6acf29698c8d7527c1b41084d4aca7e58b5fd8b1fcc9720
      REFRESH_BASE_ARCH: arm64
      REFRESH_BASE_TOOLCHAIN_FINGERPRINT: a1458fd28c3afdab2f5eaf5c99ed2f42a9494bd9da3bc34a7ab11d493067e324
      REFRESH_BASE_MIN_OS: 26.5
    steps:
      - name: Checkout gnucash-on-osx
        uses: actions/checkout@v6
        with:
          path: gnucash-on-osx

      - name: Checkout GnuCash
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gnucash_repository || 'copystring/gnucash' }}
          ref: ${{ inputs.gnucash_ref || 'feature/gtk4-migration-updated' }}
          path: gnucash-source

      - name: Test GTK4 archive contracts
        run: |
          bash "$GITHUB_WORKSPACE/gnucash-on-osx/tests/test-depstarball-icon-themes.sh"
          bash "$GITHUB_WORKSPACE/gnucash-on-osx/tests/test-depstarball-bundle-inputs.sh"

      - name: Fingerprint macOS toolchain
        id: toolchain
        run: |
          set -euo pipefail
          {
            sw_vers -productVersion
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            uname -m
          } | shasum -a 256 | awk '{ print "fingerprint=" $1 }' >> "$GITHUB_OUTPUT"

      - name: Validate GTK4 refresh toolchain
        if: inputs.gtk_refresh == true
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$REFRESH_BASE_ARCH"
          current_os="$(sw_vers -productVersion)"
          current_sdk="$(xcrun --sdk macosx --show-sdk-version)"
          python3 - "$REFRESH_BASE_MIN_OS" "$current_os" "$current_sdk" <<'PY'
          import sys

          def version(value):
              try:
                  return tuple(map(int, value.split('.')))
              except ValueError as error:
                  raise SystemExit(f"Invalid macOS version: {value}") from error

          base, os_version, sdk_version = map(version, sys.argv[1:])
          if os_version < base:
              raise SystemExit(f"Runner macOS {os_version} cannot support refresh target {base}")
          if sdk_version < base:
              raise SystemExit(f"SDK {sdk_version} cannot support refresh target {base}")
          PY
          {
            printf 'MACOSX_DEPLOYMENT_TARGET=%s\n' "$REFRESH_BASE_MIN_OS"
            printf 'REFRESH_CURRENT_TOOLCHAIN_FINGERPRINT=%s\n' "${{ steps.toolchain.outputs.fingerprint }}"
          } >> "$GITHUB_ENV"
          {
            printf '### GTK refresh toolchain provenance\n\n'
            printf '%s\n' "- Base fingerprint: $REFRESH_BASE_TOOLCHAIN_FINGERPRINT"
            printf '%s\n' "- Current fingerprint: ${{ steps.toolchain.outputs.fingerprint }}"
            printf '%s\n' "- Refresh deployment target: $REFRESH_BASE_MIN_OS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore validated GTK4 dependencies
        id: gtk4-dependencies-cache
        if: inputs.gtk_refresh != true
        uses: actions/cache/restore@v5
        with:
          path: |
            /Users/runner/.new_local
            /Users/runner/Source/jhbuild
            /Users/runner/gnucash/inst
            /Users/runner/gnucash/src/googletest-1.17.0
          key: gtk4-jhbuild-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ env.GTK_OSX_REF }}-${{ env.JHBUILD_REF }}-${{ env.CARGO_C_SHA256 }}-${{ hashFiles('gnucash-on-osx/jhbuildrc-custom', 'gnucash-on-osx/modulesets/gnucash.modules', 'gnucash-on-osx/patches/**') }}

      - name: Restore legacy validated GTK4 dependencies
        id: gtk4-dependencies-cache-legacy
        if: inputs.gtk_refresh != true && steps.gtk4-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            /Users/runner/.new_local
            /Users/runner/gnucash/inst
            /Users/runner/gnucash/src/googletest-1.17.0
          key: gtk4-jhbuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ env.GTK_OSX_REF }}-${{ env.CARGO_C_SHA256 }}-${{ hashFiles('gnucash-on-osx/jhbuildrc-custom', 'gnucash-on-osx/modulesets/gnucash.modules', 'gnucash-on-osx/patches/**') }}

      - name: Install GTK-OSX build environment
        if: inputs.gtk_refresh == true || (steps.gtk4-dependencies-cache.outputs.cache-hit != 'true' && steps.gtk4-dependencies-cache-legacy.outputs.cache-hit != 'true')
        run: |
          brew install perl-xml-parser
          perl -MXML::Parser -e 1
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 \
            "https://raw.githubusercontent.com/GNOME/gtk-osx/$GTK_OSX_REF/gtk-osx-setup.sh" \
            --output "$RUNNER_TEMP/gtk-osx-setup.sh"
          bash "$RUNNER_TEMP/gtk-osx-setup.sh"

      - name: Pin JHBuild source
        run: |
          set -euo pipefail
          jhbuild_source="$HOME/Source/jhbuild"
          if [ "$(git -C "$jhbuild_source" rev-parse HEAD 2>/dev/null || true)" != "$JHBUILD_REF" ]; then
            mkdir -p "$(dirname "$jhbuild_source")"
            if [ ! -d "$jhbuild_source/.git" ]; then
              git init "$jhbuild_source"
              git -C "$jhbuild_source" remote add origin \
                https://gitlab.gnome.org/GNOME/jhbuild.git
            fi
            for attempt in 1 2 3
            do
              if git -C "$jhbuild_source" fetch --depth=1 origin "$JHBUILD_REF"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "JHBuild source download failed; retrying after a transient-error delay" >&2
              sleep $((attempt * 30))
            done
            git -C "$jhbuild_source" checkout --detach "$JHBUILD_REF"
          fi
          test "$(git -C "$jhbuild_source" rev-parse HEAD)" = "$JHBUILD_REF"

      - name: Configure GTK-OSX build environment
        run: |
          set -euo pipefail
          test -x "$JHBUILD"
          mkdir -p "$HOME/.config"
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 \
            "https://raw.githubusercontent.com/GNOME/gtk-osx/$GTK_OSX_REF/jhbuildrc-gtk-osx" \
            --output "$RUNNER_TEMP/jhbuildrc-gtk-osx"
          install -m 600 "$RUNNER_TEMP/jhbuildrc-gtk-osx" \
            "$HOME/.config/jhbuildrc"
          cp "$GITHUB_WORKSPACE/gnucash-on-osx/jhbuildrc-custom" \
            "$HOME/.config/jhbuildrc-custom"
          "$JHBUILD" help >/dev/null
          "$JHBUILD" run bash \
            "$GITHUB_WORKSPACE/gnucash-on-osx/verify-jhbuild-prefix.sh" \
            "$ROOT_DIR/inst"
          echo "$HOME/.new_local/bin" >> "$GITHUB_PATH"

      - name: Verify GTK4 refresh compiler target
        if: inputs.gtk_refresh == true
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/gtk-refresh-target.c"
          library="$RUNNER_TEMP/libgtk-refresh-target.dylib"
          printf 'int gtk_refresh_target_probe(void) { return 0; }\n' > "$source"
          "$JHBUILD" run bash \
            "$GITHUB_WORKSPACE/gnucash-on-osx/verify-jhbuild-deployment-target.sh" \
            "$REFRESH_BASE_MIN_OS" "$source" "$library"

      - name: Bootstrap GTK-OSX
        if: inputs.gtk_refresh == true || (steps.gtk4-dependencies-cache.outputs.cache-hit != 'true' && steps.gtk4-dependencies-cache-legacy.outputs.cache-hit != 'true')
        run: |
          for attempt in 1 2 3
          do
            if "$JHBUILD" --no-interact --exit-on-error bootstrap-gtk-osx; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "GTK-OSX bootstrap failed; retrying after a transient-error delay" >&2
            sleep $((attempt * 30))
          done

      - name: Build tooling
        if: inputs.gtk_refresh != true && steps.gtk4-dependencies-cache.outputs.cache-hit != 'true' && steps.gtk4-dependencies-cache-legacy.outputs.cache-hit != 'true'
        run: |
          cargo_c_archive="$RUNNER_TEMP/cargo-c-macos.zip"
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 \
            "$CARGO_C_URL" --output "$cargo_c_archive"
          echo "$CARGO_C_SHA256  $cargo_c_archive" | shasum -a 256 -c -
          ditto -x -k "$cargo_c_archive" "$HOME/.cargo/bin"
          cargo-cbuild --version
          for attempt in 1 2 3
          do
            if "$JHBUILD" --no-interact --exit-on-error update pygments; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Tooling download failed; retrying after a transient-error delay" >&2
            sleep $((attempt * 30))
          done
          "$JHBUILD" --no-interact --exit-on-error build --no-network pygments

      - name: Build GTK4 dependencies
        if: inputs.gtk_refresh != true && steps.gtk4-dependencies-cache.outputs.cache-hit != 'true' && steps.gtk4-dependencies-cache-legacy.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3
          do
            if "$JHBUILD" --no-interact --exit-on-error update meta-gnucash-gtk4-dependencies; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "GTK4 dependency download failed; retrying after a transient-error delay" >&2
            sleep $((attempt * 30))
          done
          "$JHBUILD" --no-interact --exit-on-error build --no-network meta-gnucash-gtk4-dependencies

      - name: Restore and validate GTK4 refresh base
        if: inputs.gtk_refresh == true
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/gnucash-on-osx" fetch --no-tags --depth=1 origin "$REFRESH_BASE_RECIPE_REF"
          git -C "$GITHUB_WORKSPACE/gnucash-on-osx" cat-file -e "$REFRESH_BASE_RECIPE_REF^{commit}"
          git -C "$GITHUB_WORKSPACE/gnucash-on-osx" diff --exit-code \
            "$REFRESH_BASE_RECIPE_REF" -- dependencies-gtk4.txt
          python3 - "$GITHUB_WORKSPACE/gnucash-on-osx" "$REFRESH_BASE_RECIPE_REF" <<'PY'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          checkout, baseline = sys.argv[1:]
          current = ET.parse(f"{checkout}/modulesets/gnucash.modules").getroot()
          baseline_xml = subprocess.check_output(
              ["git", "-C", checkout, "show", f"{baseline}:modulesets/gnucash.modules"],
              text=True)
          base = ET.fromstring(baseline_xml)

          def gtk_module(root):
              return next(module for module in root if module.attrib.get("id") == "gtk-4")

          expected_new = [
              "gtk-4.22.1-macos-toplevel-remap.patch",
              "gtk-4.22.1-column-view-focus-column-ownership.patch",
              "gtk-4.22.1-window-deferred-focus-ownership.patch",
          ]
          old, new = gtk_module(base), gtk_module(current)
          if old.attrib != new.attrib:
              raise SystemExit("GTK refresh base has different GTK module arguments")
          if old.find("branch").attrib != new.find("branch").attrib:
              raise SystemExit("GTK refresh base has different GTK source identity")
          if [item.attrib["package"] for item in old.find("dependencies")] != [item.attrib["package"] for item in new.find("dependencies")]:
              raise SystemExit("GTK refresh base has different GTK dependencies")
          if [item.attrib["file"] for item in old.find("branch").findall("patch")] != expected_new[:1]:
              raise SystemExit("GTK refresh base has an unexpected GTK patch set")
          if [item.attrib["file"] for item in new.find("branch").findall("patch")] != expected_new:
              raise SystemExit("GTK refresh mode permits only the audited ownership patches")
          PY
          archive="$RUNNER_TEMP/gtk4-refresh-base.tar.xz"
          curl --fail --location --show-error "$REFRESH_BASE_URL" --output "$archive"
          echo "$REFRESH_BASE_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$ROOT_DIR/inst"
          tar -xJf "$archive" -C "$ROOT_DIR/inst"
          require_version() {
            test "$("$ROOT_DIR/inst/bin/pkgconf" --modversion "$1")" = "$2"
          }
          require_version glib-2.0 2.88.0
          require_version gobject-2.0 2.88.0
          require_version gio-2.0 2.88.0
          require_version gmodule-2.0 2.88.0
          require_version gio-unix-2.0 2.88.0
          require_version cairo 1.18.4
          require_version cairo-gobject 1.18.4
          require_version libffi 3.5.2
          require_version epoxy 1.5.10
          require_version gtk4 4.22.1
          "$ROOT_DIR/inst/bin/pkgconf" --exists gtk4-macos gwengui-gtk4 aqbanking
          "$JHBUILD" run "$ROOT_DIR/inst/bin/python3" - <<'PY'
          import sys
          if sys.version_info < (3, 8):
              raise SystemExit("gobject-introspection requires Python 3.8 or newer")
          PY
          meson_version="$("$JHBUILD" run meson --version)"
          python3 - "$meson_version" <<'PY'
          import sys
          version = tuple(map(int, sys.argv[1].split('.')))
          if version < (1, 4):
              raise SystemExit(f"gobject-introspection requires Meson 1.4 or newer, found {sys.argv[1]}")
          PY
          test ! -e "$ROOT_DIR/inst/bin/g-ir-scanner"
          test ! -e "$ROOT_DIR/inst/include/epoxy/gl.h"
          base_archs="$(lipo -archs "$ROOT_DIR/inst/lib/libgtk-4.1.dylib")"
          case " $base_archs " in
            *" $REFRESH_BASE_ARCH "*) ;;
            *) echo "Refresh base GTK architecture mismatch: $base_archs" >&2; exit 1 ;;
          esac
          base_min_os="$(otool -l "$ROOT_DIR/inst/lib/libgtk-4.1.dylib" | awk '
            $1 == "cmd" && ($2 == "LC_BUILD_VERSION" || $2 == "LC_VERSION_MIN_MACOSX") { active = 1; next }
            active && ($1 == "minos" || $1 == "version") { print $2; exit }
            $1 == "cmd" { active = 0 }
          ')"
          test "$base_min_os" = "$REFRESH_BASE_MIN_OS"
          printf 'REFRESH_BASE_GTK_MIN_OS=%s\n' "$base_min_os" >> "$GITHUB_ENV"

      - name: Rebuild GTK4 refresh closure
        if: inputs.gtk_refresh == true
        run: |
          set -euo pipefail
          # The published runtime archive contains libffi and its .pc file but
          # predates the developer headers required to rebuild GI. Rebuild this
          # one pinned prerequisite through GTK-OSX, then prove the remaining
          # archived developer closure before starting the three large modules.
          "$JHBUILD" --no-interact --exit-on-error updateone libffi
          "$JHBUILD" --no-interact --exit-on-error buildone --force --no-network libffi
          "$JHBUILD" run bash \
            "$GITHUB_WORKSPACE/gnucash-on-osx/verify-gtk4-refresh-build-closure.sh" \
            "$ROOT_DIR/inst" 3.5.2
          for module in gobject-introspection libepoxy gtk-4
          do
            "$JHBUILD" --no-interact --exit-on-error updateone "$module"
            "$JHBUILD" --no-interact --exit-on-error buildone --force --no-network "$module"
          done
          test -x "$ROOT_DIR/inst/bin/g-ir-scanner"
          test -x "$ROOT_DIR/inst/bin/g-ir-compiler"
          test -d "$ROOT_DIR/inst/include/gobject-introspection-1.0"
          test -f "$ROOT_DIR/inst/include/ffi.h"
          test -f "$ROOT_DIR/inst/include/ffitarget.h"
          test -d "$ROOT_DIR/inst/share/gir-1.0"
          test -e "$ROOT_DIR/inst/lib/libgirepository-1.0.dylib"
          test -f "$ROOT_DIR/inst/include/epoxy/gl.h"
          test "$("$ROOT_DIR/inst/bin/pkgconf" --modversion epoxy)" = 1.5.10
          test "$("$ROOT_DIR/inst/bin/pkgconf" --modversion gtk4)" = 4.22.1
          rebuilt_min_os="$(otool -l "$ROOT_DIR/inst/lib/libgtk-4.1.dylib" | awk '
            $1 == "cmd" && ($2 == "LC_BUILD_VERSION" || $2 == "LC_VERSION_MIN_MACOSX") { active = 1; next }
            active && ($1 == "minos" || $1 == "version") { print $2; exit }
            $1 == "cmd" { active = 0 }
          ')"
          test -n "$rebuilt_min_os"
          test "$rebuilt_min_os" = "$REFRESH_BASE_GTK_MIN_OS"
          {
            printf '### GTK refresh base\n\n'
            printf '%s\n' "- Recipe: $REFRESH_BASE_RECIPE_REF"
            printf '%s\n' "- Archive: $REFRESH_BASE_URL"
            printf '%s\n' "- Archive SHA-256: $REFRESH_BASE_SHA256"
            printf '%s\n' "- Toolchain fingerprint: $REFRESH_BASE_TOOLCHAIN_FINGERPRINT"
            printf '%s\n' "- Current toolchain fingerprint: $REFRESH_CURRENT_TOOLCHAIN_FINGERPRINT"
            printf '%s\n' "- GTK minimum macOS: $rebuilt_min_os"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Googletest source for GTK4 refresh Core check
        if: inputs.gtk_refresh == true
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-1.17.0.tar.gz"
          mkdir -p "$ROOT_DIR/src"
          curl --fail --location --show-error "$GTEST_URL" --output "$archive"
          echo "$GTEST_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$ROOT_DIR/src"
          test -f "$ROOT_DIR/src/googletest-1.17.0/CMakeLists.txt"

      - name: Verify GTK4 dependency contract
        run: |
          "$JHBUILD" run \
            "$ROOT_DIR/inst/bin/pkgconf" --atleast-version=4.14 gtk4
          "$JHBUILD" run \
            "$ROOT_DIR/inst/bin/pkgconf" --exists \
            gtk4-macos gwengui-gtk4 aqbanking

      - name: Cache validated GTK4 dependencies
        if: inputs.gtk_refresh != true && steps.gtk4-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /Users/runner/.new_local
            /Users/runner/Source/jhbuild
            /Users/runner/gnucash/inst
            /Users/runner/gnucash/src/googletest-1.17.0
          key: ${{ steps.gtk4-dependencies-cache.outputs.cache-primary-key }}

      - name: Assemble archive and test GnuCash
        env:
          GC_VERSION: future-gtk4
          GNC_SOURCE_DIR: ${{ github.workspace }}/gnucash-source
          DEPS_FILE: ${{ github.workspace }}/gnucash-on-osx/dependencies-gtk4.txt
          TARBALL: ${{ github.workspace }}/gnucash-future-gtk4-mac-dependencies.tar
          VERIFY_GTK4: 1
        run: |
          "$JHBUILD" run \
            bash "$GITHUB_WORKSPACE/gnucash-on-osx/depstarball.sh"
          shasum -a 256 \
            "$GITHUB_WORKSPACE/gnucash-future-gtk4-mac-dependencies.tar.xz" \
            > "$GITHUB_WORKSPACE/gnucash-future-gtk4-mac-dependencies.tar.xz.sha256"

      - name: Upload dependency archive
        uses: actions/upload-artifact@v7
        with:
          name: gnucash-future-gtk4-mac-dependencies
          path: |
            gnucash-future-gtk4-mac-dependencies.tar.xz
            gnucash-future-gtk4-mac-dependencies.tar.xz.sha256
          if-no-files-found: error

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gtk4-test-log
          path: /Users/runner/gnucash/build/gnucash-git/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
