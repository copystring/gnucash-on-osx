name: Reviewed GTK4 macOS refresh
# Retry the reviewed refresh with the complete pinned native and introspection
# closures, including the verified zlib fossil and the pinned GLib/GI/GLib cycle.

on:
  push:
    branches:
      - fix/gtk4-macos-bundle-artifact
    paths:
      - .github/workflows/gtk4-reviewed-macos-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'copystring/gnucash-on-osx' && github.ref == 'refs/heads/fix/gtk4-macos-bundle-artifact'
    uses: ./.github/workflows/gtk4-macos-dependencies.yml
    with:
      gnucash_repository: copystring/gnucash
      gnucash_ref: 7820bd5891d09a3264128721a445837983624213
      gtk_refresh: true

