name: macos-gtk4-bundle-preflight

on:
  workflow_dispatch:
    inputs:
      core_repository:
        description: GnuCash repository to build
        required: true
        default: copystring/gnucash
      core_ref:
        description: GnuCash branch, tag, or commit to bundle
        required: true
        default: feature/gtk4-migration-updated
      docs_repository:
        description: Optional GitHub owner/repository for pinned documentation
        required: false
        default: ''
      docs_branch:
        description: Branch containing the pinned documentation commit
        required: false
        default: ''
      docs_ref:
        description: Optional full 40-character documentation commit SHA
        required: false
        default: ''
      dependencies_url:
        description: URL of the published GTK4 macOS dependency archive
        required: true
      dependencies_sha256:
        description: SHA-256 of the published GTK4 macOS dependency archive
        required: true
  workflow_call:
    inputs:
      core_repository:
        required: true
        type: string
      core_ref:
        required: true
        type: string
      docs_repository:
        required: false
        type: string
        default: ''
      docs_branch:
        required: false
        type: string
        default: ''
      docs_ref:
        required: false
        type: string
        default: ''
      dependencies_url:
        required: false
        type: string
        default: ''
      dependencies_sha256:
        required: false
        type: string
        default: ''
      dependencies_repository:
        required: false
        type: string
        default: ''
      dependencies_run_id:
        required: false
        type: string
        default: ''
      dependencies_workflow:
        required: false
        type: string
        default: ''
      dependencies_head_sha:
        required: false
        type: string
        default: ''
      dependencies_artifact_name:
        required: false
        type: string
        default: ''
      dependencies_deployment_target:
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  bundle_preflight:
    name: Build and smoke-test GTK4 app bundle
    runs-on: macos-26
    timeout-minutes: 120
    env:
      JHBUILD: /Users/runner/.new_local/bin/jhbuild
      MODULESET: ${{ github.workspace }}/gnucash-on-osx/modulesets/gnucash.modules
      GTK_OSX_SETUP_REF: 0889e034206c1019e408cff7e9f426fccd5e034e
      JHBUILD_REF: 16e05af9b58b9e7433ce7417ecd8915beba59133
      GTK_MAC_BUNDLER_REF: fbc6ffd1590cec6fef6e17ec19b6aa00ce01ca6d
      GTEST_URL: https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
      GTEST_SHA256: 65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c
      BUNDLE_REVISION: 1
      DOCS_REPOSITORY: ${{ inputs.docs_repository }}
      DOCS_BRANCH: ${{ inputs.docs_branch }}
      DOCS_REF: ${{ inputs.docs_ref }}

    steps:
      - name: Initialize build paths
        run: |
          set -euo pipefail
          build_root="$HOME/gnucash"
          {
            printf 'ROOT_DIR=%s\n' "$build_root"
            printf 'PREFIX=%s\n' "$build_root"
            printf 'INSTALL_PREFIX=%s\n' "$build_root/inst"
            printf 'BUNDLE_HOME=%s\n' "$RUNNER_TEMP/gnucash-bundle-home"
            printf 'APP_BUNDLE=%s\n' "$RUNNER_TEMP/gnucash-bundle-home/Gnucash.app"
          } >> "$GITHUB_ENV"

      - name: Checkout gnucash-on-osx
        uses: actions/checkout@v6
        with:
          path: gnucash-on-osx

      - name: Validate dependency archive source
        env:
          DEPENDENCIES_URL: ${{ inputs.dependencies_url }}
          DEPENDENCIES_SHA256: ${{ inputs.dependencies_sha256 }}
          DEPENDENCIES_REPOSITORY: ${{ inputs.dependencies_repository }}
          DEPENDENCIES_RUN_ID: ${{ inputs.dependencies_run_id }}
          DEPENDENCIES_WORKFLOW: ${{ inputs.dependencies_workflow }}
          DEPENDENCIES_HEAD_SHA: ${{ inputs.dependencies_head_sha }}
          DEPENDENCIES_ARTIFACT_NAME: ${{ inputs.dependencies_artifact_name }}
          DEPENDENCIES_DEPLOYMENT_TARGET: ${{ inputs.dependencies_deployment_target }}
        run: |
          set -euo pipefail
          if test -n "$DEPENDENCIES_RUN_ID"; then
            test -z "$DEPENDENCIES_URL"
            test -z "$DEPENDENCIES_SHA256"
            test -n "$DEPENDENCIES_REPOSITORY"
            test -n "$DEPENDENCIES_WORKFLOW"
            test -n "$DEPENDENCIES_HEAD_SHA"
            test -n "$DEPENDENCIES_ARTIFACT_NAME"
            test -n "$DEPENDENCIES_DEPLOYMENT_TARGET"
            case "$DEPENDENCIES_RUN_ID" in
              *[!0-9]*|'') echo 'Invalid dependency run ID.' >&2; exit 1 ;;
            esac
            printf 'DEPENDENCY_ARCHIVE_SOURCE=artifact\n' >> "$GITHUB_ENV"
          else
            test -n "$DEPENDENCIES_URL"
            test -n "$DEPENDENCIES_SHA256"
            test -z "$DEPENDENCIES_REPOSITORY"
            test -z "$DEPENDENCIES_WORKFLOW"
            test -z "$DEPENDENCIES_HEAD_SHA"
            test -z "$DEPENDENCIES_ARTIFACT_NAME"
            case "$DEPENDENCIES_SHA256" in
              *[!0-9a-f]*|'') echo 'Invalid dependency SHA-256.' >&2; exit 1 ;;
            esac
            test "${#DEPENDENCIES_SHA256}" -eq 64
            printf 'DEPENDENCY_ARCHIVE_SOURCE=published\n' >> "$GITHUB_ENV"
          fi
          if test -n "$DEPENDENCIES_DEPLOYMENT_TARGET"; then
            if ! [[ "$DEPENDENCIES_DEPLOYMENT_TARGET" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo 'Invalid dependency deployment target.' >&2
              exit 1
            fi
            printf 'ARCHIVE_MACOS_DEPLOYMENT_TARGET=%s\n' \
              "$DEPENDENCIES_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
            printf 'MACOSX_DEPLOYMENT_TARGET=%s\n' \
              "$DEPENDENCIES_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
          fi

      - name: Configure optional pinned documentation source
        env:
          DOCS_OVERLAY: ${{ runner.temp }}/gnucash-docs-pinned.modules
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/gnucash-on-osx/modulesets/generate-docs-overlay.py" \
            "$MODULESET" "$DOCS_OVERLAY" "$DOCS_REPOSITORY" \
            "$DOCS_BRANCH" "$DOCS_REF"
          if test -n "$DOCS_REPOSITORY"; then
            test -f "$DOCS_OVERLAY"
            docs_origin="https://github.com/${DOCS_REPOSITORY}.git"
            branch_head="$(git ls-remote "$docs_origin" \
              "refs/heads/$DOCS_BRANCH" | awk 'NR == 1 { print $1 }')"
            test "$branch_head" = "$DOCS_REF"
            printf 'DOCS_MODULESET=%s\n' "$DOCS_OVERLAY" >> "$GITHUB_ENV"
          else
            test ! -e "$DOCS_OVERLAY"
          fi

      - name: Checkout GnuCash
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.core_repository }}
          ref: ${{ inputs.core_ref }}
          path: gnucash-source

      - name: Test macOS app bundle contract
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/gnucash-on-osx/tests/test-macos-bundle-metadata.py"
          bash "$GITHUB_WORKSPACE/gnucash-on-osx/tests/test-verify-macos-app-bundle.sh"

      - name: Install GTK-OSX build environment
        run: |
          set -euo pipefail
          brew install ninja perl-xml-parser
          perl -MXML::Parser -e 1
          curl --fail --location --show-error \
            "https://raw.githubusercontent.com/GNOME/gtk-osx/${GTK_OSX_SETUP_REF}/gtk-osx-setup.sh" \
            --output "$RUNNER_TEMP/gtk-osx-setup.sh"
          bash "$GITHUB_WORKSPACE/gnucash-on-osx/prepare-jhbuild-source.sh" \
            "$HOME/Source/jhbuild" "$JHBUILD_REF"
          bash "$RUNNER_TEMP/gtk-osx-setup.sh"
          git -C "$HOME/Source/jhbuild" checkout --detach "$JHBUILD_REF"
          test "$(git -C "$HOME/Source/jhbuild" rev-parse HEAD)" = "$JHBUILD_REF"
          test -f "$HOME/Source/jhbuild/jhbuild/__init__.py" || {
            echo 'JHBuild Python package is missing after GTK-OSX setup.' >&2
            exit 1
          }
          cp "$GITHUB_WORKSPACE/gnucash-on-osx/jhbuildrc-custom" \
            "$HOME/.config/jhbuildrc-custom"
          if ! "$JHBUILD" help >/dev/null; then
            echo 'GTK-OSX setup did not install a working JHBuild launcher.' >&2
            exit 1
          fi
          "$JHBUILD" run bash \
            "$GITHUB_WORKSPACE/gnucash-on-osx/verify-jhbuild-prefix.sh" \
            "$INSTALL_PREFIX"
          echo "$HOME/.new_local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap GTK-OSX
        run: |
          set -euo pipefail
          # gtk-osx's bootstrap command requires a single moduleset path;
          # the pinned docs overlay is needed only by the later docs build.
          DOCS_MODULESET= "$JHBUILD" bootstrap-gtk-osx

      - name: Download published GTK4 dependencies
        if: env.DEPENDENCY_ARCHIVE_SOURCE == 'published'
        env:
          DEPENDENCIES_URL: ${{ inputs.dependencies_url }}
          DEPENDENCIES_SHA256: ${{ inputs.dependencies_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gnucash-gtk4-dependencies.tar.xz"
          curl --fail --location --show-error "$DEPENDENCIES_URL" --output "$archive"
          echo "$DEPENDENCIES_SHA256  $archive" | shasum -a 256 -c -
          printf 'DEPENDENCIES_ARCHIVE_SHA256=%s\n' "$DEPENDENCIES_SHA256" \
            >> "$GITHUB_ENV"

      - name: Resolve pinned GTK4 dependency artifact
        id: dependency_artifact
        if: env.DEPENDENCY_ARCHIVE_SOURCE == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCIES_REPOSITORY: ${{ inputs.dependencies_repository }}
          DEPENDENCIES_RUN_ID: ${{ inputs.dependencies_run_id }}
          DEPENDENCIES_WORKFLOW: ${{ inputs.dependencies_workflow }}
          DEPENDENCIES_HEAD_SHA: ${{ inputs.dependencies_head_sha }}
          DEPENDENCIES_ARTIFACT_NAME: ${{ inputs.dependencies_artifact_name }}
          DEPENDENCIES_DEPLOYMENT_TARGET: ${{ inputs.dependencies_deployment_target }}
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/dependency-run.json"
          artifacts_json="$RUNNER_TEMP/dependency-artifacts.json"
          api="https://api.github.com/repos/$DEPENDENCIES_REPOSITORY"
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          curl --fail --location --show-error "${headers[@]}" \
            "$api/actions/runs/$DEPENDENCIES_RUN_ID" --output "$run_json"
          curl --fail --location --show-error "${headers[@]}" --get \
            --data-urlencode "name=$DEPENDENCIES_ARTIFACT_NAME" \
            --data-urlencode 'per_page=100' \
            "$api/actions/runs/$DEPENDENCIES_RUN_ID/artifacts" \
            --output "$artifacts_json"
          python3 \
            "$GITHUB_WORKSPACE/gnucash-on-osx/verify-github-actions-artifact.py" \
            --run-json "$run_json" \
            --artifacts-json "$artifacts_json" \
            --repository "$DEPENDENCIES_REPOSITORY" \
            --run-id "$DEPENDENCIES_RUN_ID" \
            --workflow "$DEPENDENCIES_WORKFLOW" \
            --head-sha "$DEPENDENCIES_HEAD_SHA" \
            --artifact-name "$DEPENDENCIES_ARTIFACT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download pinned GTK4 dependency artifact
        if: env.DEPENDENCY_ARCHIVE_SOURCE == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DOWNLOAD_URL: ${{ steps.dependency_artifact.outputs.artifact_download_url }}
          ARTIFACT_SHA256: ${{ steps.dependency_artifact.outputs.artifact_sha256 }}
          DEPENDENCIES_REPOSITORY: ${{ inputs.dependencies_repository }}
          DEPENDENCIES_RUN_ID: ${{ inputs.dependencies_run_id }}
          DEPENDENCIES_WORKFLOW: ${{ inputs.dependencies_workflow }}
          DEPENDENCIES_HEAD_SHA: ${{ inputs.dependencies_head_sha }}
          DEPENDENCIES_ARTIFACT_NAME: ${{ inputs.dependencies_artifact_name }}
          DEPENDENCIES_DEPLOYMENT_TARGET: ${{ inputs.dependencies_deployment_target }}
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/gnucash-gtk4-dependencies-artifact.zip"
          extracted="$RUNNER_TEMP/gnucash-gtk4-dependencies-artifact"
          archive="$RUNNER_TEMP/gnucash-gtk4-dependencies.tar.xz"
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          curl --fail --location --show-error "${headers[@]}" \
            "$ARTIFACT_DOWNLOAD_URL" --output "$artifact_zip"
          echo "$ARTIFACT_SHA256  $artifact_zip" | shasum -a 256 -c -
          mkdir "$extracted"
          ditto -x -k "$artifact_zip" "$extracted"
          source_archive="$extracted/gnucash-future-gtk4-mac-dependencies.tar.xz"
          sidecar="$source_archive.sha256"
          test -f "$source_archive"
          test -f "$sidecar"
          recorded_sha256="$(awk 'NR == 1 && NF == 2 { print $1 }' "$sidecar")"
          case "$recorded_sha256" in
            *[!0-9a-f]*|'') echo 'Invalid archive SHA-256 sidecar.' >&2; exit 1 ;;
          esac
          test "${#recorded_sha256}" -eq 64
          test "$(wc -l < "$sidecar" | tr -d ' ')" -eq 1
          actual_sha256="$(shasum -a 256 "$source_archive" | awk '{ print $1 }')"
          test "$actual_sha256" = "$recorded_sha256"
          mv "$source_archive" "$archive"
          printf 'DEPENDENCIES_ARCHIVE_SHA256=%s\n' "$actual_sha256" \
            >> "$GITHUB_ENV"
          {
            printf '### Dependency artifact provenance\n\n'
            printf '%s\n' "- Repository: $DEPENDENCIES_REPOSITORY"
            printf '%s\n' "- Workflow: $DEPENDENCIES_WORKFLOW"
            printf '%s\n' "- Run: $DEPENDENCIES_RUN_ID"
            printf '%s\n' "- Head: $DEPENDENCIES_HEAD_SHA"
            printf '%s\n' "- Artifact: $DEPENDENCIES_ARTIFACT_NAME"
            printf '%s\n' "- Deployment target: $DEPENDENCIES_DEPLOYMENT_TARGET"
            printf '%s\n' "- Artifact ZIP SHA-256: $ARTIFACT_SHA256"
            printf '%s\n' "- Dependency archive SHA-256: $actual_sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and extract GTK4 dependencies
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gnucash-gtk4-dependencies.tar.xz"
          echo "$DEPENDENCIES_ARCHIVE_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$INSTALL_PREFIX"
          tar -xJf "$archive" -C "$INSTALL_PREFIX"
          "$INSTALL_PREFIX/bin/pkgconf" --exists \
            'gtk4 >= 4.14' gtk4-macos gwengui-gtk4 aqbanking
          if test -n "${ARCHIVE_MACOS_DEPLOYMENT_TARGET:-}"; then
            metadata="$GITHUB_WORKSPACE/gnucash-on-osx/macos-bundle-metadata.py"
            gtk_min_os="$(python3 "$metadata" mach-o-minimum-system-version \
              "$INSTALL_PREFIX/lib/libgtk-4.1.dylib")"
            test "$gtk_min_os" = "$ARCHIVE_MACOS_DEPLOYMENT_TARGET"
            source="$RUNNER_TEMP/bundle-compiler-target.c"
            library="$RUNNER_TEMP/libbundle-compiler-target.dylib"
            printf 'int bundle_compiler_target_probe(void) { return 0; }\n' > "$source"
            "$JHBUILD" run bash \
              "$GITHUB_WORKSPACE/gnucash-on-osx/verify-jhbuild-deployment-target.sh" \
              "$ARCHIVE_MACOS_DEPLOYMENT_TARGET" "$source" "$library"
          fi

      - name: Download Googletest
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-1.17.0.tar.gz"
          curl --fail --location --show-error "$GTEST_URL" --output "$archive"
          echo "$GTEST_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"

      - name: Build GnuCash documentation
        run: |
          set -euo pipefail
          verify_pinned_docs_checkout() {
            if test -z "${DOCS_MODULESET:-}"; then
              return
            fi
            docs_source="$ROOT_DIR/src/gnucash-docs"
            expected_origin="https://github.com/${DOCS_REPOSITORY}.git"
            test -d "$docs_source"
            test "$(git -C "$docs_source" remote get-url origin)" = "$expected_origin"
            test "$(git -C "$docs_source" rev-parse HEAD)" = "$DOCS_REF"
          }

          if test -n "${DOCS_MODULESET:-}"; then
            "$JHBUILD" updateone gnucash-docs
            verify_pinned_docs_checkout
          fi
          # Keep archive consumption bounded even if module dependencies drift.
          "$JHBUILD" --no-interact --exit-on-error buildone gnucash-docs
          verify_pinned_docs_checkout

          test -d "$INSTALL_PREFIX/share/doc/gnucash-docs/C/gnucash-guide"

          recipe_revision="$(git -C "$GITHUB_WORKSPACE/gnucash-on-osx" rev-parse HEAD)"
          core_revision="$(git -C "$GITHUB_WORKSPACE/gnucash-source" rev-parse HEAD)"
          {
            printf '### Bundle input revisions\n\n'
            printf '%s\n' "- Recipe: $recipe_revision"
            printf '%s\n' "- Core: $core_revision"
            if test -n "${DOCS_MODULESET:-}"; then
              printf '%s\n' "- Docs repository: $DOCS_REPOSITORY"
              printf '%s\n' "- Docs branch: $DOCS_BRANCH"
              printf '%s\n' "- Docs origin: $(git -C "$ROOT_DIR/src/gnucash-docs" remote get-url origin)"
              printf '%s\n' "- Docs commit: $(git -C "$ROOT_DIR/src/gnucash-docs" rev-parse HEAD)"
            else
              printf '%s\n' '- Docs source: recipe-defined gnucash-docs module'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and install GnuCash
        run: |
          set -euo pipefail
          cmake_target=()
          if test -n "${ARCHIVE_MACOS_DEPLOYMENT_TARGET:-}"; then
            cmake_target=(
              "-DCMAKE_OSX_DEPLOYMENT_TARGET=$ARCHIVE_MACOS_DEPLOYMENT_TARGET"
            )
          fi
          cmake -S "$GITHUB_WORKSPACE/gnucash-source" -B "$ROOT_DIR/build" -GNinja \
            -DPKG_CONFIG_EXECUTABLE="$INSTALL_PREFIX/bin/pkgconf" \
            -DCMAKE_PREFIX_PATH="$INSTALL_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            "${cmake_target[@]}" \
            -DGTEST_ROOT="$RUNNER_TEMP/googletest-1.17.0"
          ninja -C "$ROOT_DIR/build"
          ninja -C "$ROOT_DIR/build" install
          if test -n "${ARCHIVE_MACOS_DEPLOYMENT_TARGET:-}"; then
            cache_target="$(sed -n \
              's/^CMAKE_OSX_DEPLOYMENT_TARGET:[^=]*=//p' \
              "$ROOT_DIR/build/CMakeCache.txt")"
            test "$cache_target" = "$ARCHIVE_MACOS_DEPLOYMENT_TARGET"
            core_min_os="$(python3 \
              "$GITHUB_WORKSPACE/gnucash-on-osx/macos-bundle-metadata.py" \
              mach-o-minimum-system-version "$INSTALL_PREFIX/bin/gnucash")"
            test "$core_min_os" = "$ARCHIVE_MACOS_DEPLOYMENT_TARGET"
          fi

      - name: Prepare macOS app bundle metadata
        run: |
          set -euo pipefail
          metadata="$GITHUB_WORKSPACE/gnucash-on-osx/macos-bundle-metadata.py"
          plist="$GITHUB_WORKSPACE/gnucash-on-osx/gnucash-bundler/Info-unstable.plist"
          core_version="$(python3 "$metadata" core-version "$ROOT_DIR/build/CMakeCache.txt")"
          copyright_year="$(date -u +%Y)"

          python3 "$metadata" prepare "$plist" "$plist" \
            "$core_version" "$BUNDLE_REVISION" "$copyright_year"
          python3 "$metadata" verify "$plist" \
            "$core_version" "$BUNDLE_REVISION" "$copyright_year"
          {
            printf 'CORE_VERSION=%s\n' "$core_version"
            printf 'BUNDLE_YEAR=%s\n' "$copyright_year"
          } >> "$GITHUB_ENV"

      - name: Install pinned GTK Mac Bundler
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/gtk-mac-bundler"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/GNOME/gtk-mac-bundler.git
          git -C "$source_dir" fetch --depth=1 origin "$GTK_MAC_BUNDLER_REF"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GTK_MAC_BUNDLER_REF"
          make -C "$source_dir" install

      - name: Create GTK4 app bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_HOME"
          "$JHBUILD" run env HOME="$BUNDLE_HOME" gtk-mac-bundler \
            "$GITHUB_WORKSPACE/gnucash-on-osx/gnucash-bundler/gnucash-unstable.bundle"

      - name: Synchronize app bundle minimum macOS version
        run: |
          set -euo pipefail
          metadata="$GITHUB_WORKSPACE/gnucash-on-osx/macos-bundle-metadata.py"
          python3 "$metadata" synchronize-minimum-system-version \
            "$APP_BUNDLE/Contents/Info.plist" "$APP_BUNDLE/Contents"

      - name: Verify GTK4 app bundle
        run: |
          set -euo pipefail
          app="$APP_BUNDLE"
          links="$RUNNER_TEMP/gnucash-bundle-otool.txt"

          bash "$GITHUB_WORKSPACE/gnucash-on-osx/verify-macos-app-bundle.sh" \
            "$app" "$CORE_VERSION" "$BUNDLE_REVISION" "$BUNDLE_YEAR"
          if test -n "${ARCHIVE_MACOS_DEPLOYMENT_TARGET:-}"; then
            app_min_os="$(python3 \
              "$GITHUB_WORKSPACE/gnucash-on-osx/macos-bundle-metadata.py" \
              mach-o-minimum-system-version "$app/Contents/MacOS/Gnucash")"
            test "$app_min_os" = "$ARCHIVE_MACOS_DEPLOYMENT_TARGET"
            bundle_min_os="$(python3 \
              "$GITHUB_WORKSPACE/gnucash-on-osx/macos-bundle-metadata.py" \
              bundle-minimum-system-version "$app/Contents")"
            test "$bundle_min_os" = "$ARCHIVE_MACOS_DEPLOYMENT_TARGET"
          fi

          forbidden="$(find "$app/Contents" \
            \( -ipath '*gtk-3.0*' -o -iname '*gtk3*' -o -iname '*gtk-3*' -o -iname '*webkit2gtk*' \) \
            -print -quit)"
          if test -n "$forbidden"; then
            echo "Unexpected GTK3 or WebKitGTK payload: $forbidden" >&2
            exit 1
          fi

          : > "$links"
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              otool -L "$binary" >> "$links"
            fi
          done < <(find "$app/Contents" -type f \( -perm -111 -o -name '*.dylib' \) -print0)

          grep -q 'libgtk-4' "$links"
          grep -q '/System/Library/Frameworks/WebKit.framework/' "$links"
          if grep -Eq 'libgtk-3|webkit2gtk' "$links"; then
            echo 'Unexpected GTK3 or WebKitGTK linkage in app bundle.' >&2
            exit 1
          fi

      - name: Smoke-test GTK4 app startup
        run: |
          set -euo pipefail
          app="$APP_BUNDLE"
          runtime_home="$RUNNER_TEMP/gnucash-runtime-home"
          log="$RUNNER_TEMP/gnucash-bundle-startup.log"
          mkdir -p "$runtime_home"

          HOME="$runtime_home" "$app/Contents/MacOS/Gnucash" --nofile >"$log" 2>&1 &
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill -TERM "$app_pid" 2>/dev/null || true
              wait "$app_pid" || true
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 20); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid"
              exit 1
            fi
            sleep 1
          done

          kill -TERM "$app_pid"
          if wait "$app_pid"; then
            status=0
          else
            status=$?
          fi
          if test "$status" -ne 0 && test "$status" -ne 143; then
            exit "$status"
          fi
          trap - EXIT

      - name: Package smoke-tested GTK4 app bundle
        run: |
          set -euo pipefail
          source_app="$APP_BUNDLE"
          staging="$(mktemp -d "$RUNNER_TEMP/gnucash-bundle-artifact.XXXXXX")"
          validation="$(mktemp -d "$RUNNER_TEMP/gnucash-bundle-validation.XXXXXX")"
          staged_app="$staging/Gnucash.app"
          restored_app="$validation/Gnucash.app"
          archive="$RUNNER_TEMP/gnucash-gtk4-macos-app.zip"

          bash "$GITHUB_WORKSPACE/gnucash-on-osx/verify-macos-app-bundle.sh" \
            "$source_app" "$CORE_VERSION" "$BUNDLE_REVISION" "$BUNDLE_YEAR"
          ditto --rsrc --extattr --acl "$source_app" "$staged_app"
          ditto -c -k --rsrc --extattr --acl --sequesterRsrc --keepParent \
            "$staged_app" "$archive"
          test -s "$archive"

          ditto -x -k --rsrc --extattr --acl "$archive" "$validation"
          bash "$GITHUB_WORKSPACE/gnucash-on-osx/verify-macos-app-bundle.sh" \
            "$restored_app" "$CORE_VERSION" "$BUNDLE_REVISION" "$BUNDLE_YEAR"

          staged_links="$validation/staged-symlinks"
          restored_links="$validation/restored-symlinks"
          find "$staged_app" -type l -print0 > "$staged_links"
          find "$restored_app" -type l -print0 > "$restored_links"

          while IFS= read -r -d '' link; do
            relative="${link#"$staged_app"/}"
            restored_link="$restored_app/$relative"
            test -L "$restored_link"
            test "$(readlink "$link")" = "$(readlink "$restored_link")"
          done < "$staged_links"

          restored_root="$(cd "$restored_app" && pwd -P)"
          while IFS= read -r -d '' link; do
            relative="${link#"$restored_app"/}"
            test -L "$staged_app/$relative"
            target="$(readlink "$link")"
            case "$target" in
              /*)
                echo "Absolute symlink in app bundle: $relative -> $target" >&2
                exit 1
                ;;
            esac
            if ! test -e "$link"; then
              echo "Missing or unresolvable symlink target: $relative -> $target" >&2
              exit 1
            fi
            if ! resolved="$(perl -MCwd=abs_path -e \
              'my $path = abs_path($ARGV[0]); exit 1 unless defined $path; print $path' \
              "$link")"; then
              echo "Dangling or cyclic symlink in app bundle: $relative -> $target" >&2
              exit 1
            fi
            case "$resolved" in
              "$restored_root"|"$restored_root"/*) ;;
              *)
                echo "Symlink escapes app bundle: $relative -> $target" >&2
                exit 1
                ;;
            esac
          done < "$restored_links"

      - name: Upload smoke-tested GTK4 app bundle
        uses: actions/upload-artifact@v7
        with:
          name: macos-gtk4-app-bundle
          path: ${{ runner.temp }}/gnucash-gtk4-macos-app.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gtk4-bundle-preflight
          path: |
            ${{ runner.temp }}/gnucash-bundle-otool.txt
            ${{ runner.temp }}/gnucash-bundle-startup.log
          if-no-files-found: ignore
