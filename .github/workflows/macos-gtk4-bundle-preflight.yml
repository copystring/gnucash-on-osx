name: macos-gtk4-bundle-preflight

on:
  workflow_dispatch:
    inputs:
      core_repository:
        description: GnuCash repository to build
        required: true
        default: copystring/gnucash
      core_ref:
        description: GnuCash branch, tag, or commit to bundle
        required: true
        default: feature/gtk4-migration-updated
      dependencies_url:
        description: URL of the published GTK4 macOS dependency archive
        required: true
      dependencies_sha256:
        description: SHA-256 of the published GTK4 macOS dependency archive
        required: true

permissions:
  contents: read

jobs:
  bundle_preflight:
    name: Build and smoke-test GTK4 app bundle
    runs-on: macos-26
    timeout-minutes: 120
    env:
      JHBUILD: /Users/runner/.new_local/bin/jhbuild
      MODULESET: ${{ github.workspace }}/gnucash-on-osx/modulesets/gnucash.modules
      GTK_OSX_SETUP_REF: 0889e034206c1019e408cff7e9f426fccd5e034e
      GTK_MAC_BUNDLER_REF: fbc6ffd1590cec6fef6e17ec19b6aa00ce01ca6d
      GTEST_URL: https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
      GTEST_SHA256: 65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c

    steps:
      - name: Initialize build paths
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/gnucash-bundle-preflight"
          {
            printf 'ROOT_DIR=%s\n' "$build_root"
            printf 'PREFIX=%s\n' "$build_root"
            printf 'INSTALL_PREFIX=%s\n' "$build_root/inst"
          } >> "$GITHUB_ENV"

      - name: Checkout gnucash-on-osx
        uses: actions/checkout@v6
        with:
          path: gnucash-on-osx

      - name: Checkout GnuCash
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.core_repository }}
          ref: ${{ inputs.core_ref }}
          path: gnucash-source

      - name: Install GTK-OSX build environment
        run: |
          set -euo pipefail
          brew install ninja perl-xml-parser
          perl -MXML::Parser -e 1
          curl --fail --location --show-error \
            "https://raw.githubusercontent.com/GNOME/gtk-osx/${GTK_OSX_SETUP_REF}/gtk-osx-setup.sh" \
            --output "$RUNNER_TEMP/gtk-osx-setup.sh"
          bash "$RUNNER_TEMP/gtk-osx-setup.sh"
          cp "$GITHUB_WORKSPACE/gnucash-on-osx/jhbuildrc-custom" \
            "$HOME/.config/jhbuildrc-custom"
          echo "$HOME/.new_local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap GTK-OSX
        run: |
          set -euo pipefail
          "$JHBUILD" bootstrap-gtk-osx

      - name: Download published GTK4 dependencies
        env:
          DEPENDENCIES_URL: ${{ inputs.dependencies_url }}
          DEPENDENCIES_SHA256: ${{ inputs.dependencies_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gnucash-gtk4-dependencies.tar.xz"
          mkdir -p "$INSTALL_PREFIX"
          curl --fail --location --show-error "$DEPENDENCIES_URL" --output "$archive"
          echo "$DEPENDENCIES_SHA256  $archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$INSTALL_PREFIX"
          "$INSTALL_PREFIX/bin/pkgconf" --exists \
            'gtk4 >= 4.14' gtk4-macos gwengui-gtk4 aqbanking

      - name: Download Googletest
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-1.17.0.tar.gz"
          curl --fail --location --show-error "$GTEST_URL" --output "$archive"
          echo "$GTEST_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"

      - name: Build GnuCash documentation
        run: |
          set -euo pipefail
          "$JHBUILD" build gnucash-docs

          test -d "$INSTALL_PREFIX/share/doc/gnucash-docs/C/gnucash-guide"

      - name: Build and install GnuCash
        run: |
          set -euo pipefail
          cmake -S "$GITHUB_WORKSPACE/gnucash-source" -B "$ROOT_DIR/build" -GNinja \
            -DPKG_CONFIG_EXECUTABLE="$INSTALL_PREFIX/bin/pkgconf" \
            -DCMAKE_PREFIX_PATH="$INSTALL_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DGTEST_ROOT="$RUNNER_TEMP/googletest-1.17.0"
          ninja -C "$ROOT_DIR/build"
          ninja -C "$ROOT_DIR/build" install

      - name: Install pinned GTK Mac Bundler
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/gtk-mac-bundler"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/GNOME/gtk-mac-bundler.git
          git -C "$source_dir" fetch --depth=1 origin "$GTK_MAC_BUNDLER_REF"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GTK_MAC_BUNDLER_REF"
          make -C "$source_dir" install

      - name: Create GTK4 app bundle
        run: |
          set -euo pipefail
          bundle_home="$RUNNER_TEMP/gnucash-bundle-home"
          mkdir -p "$bundle_home"
          "$JHBUILD" run env HOME="$bundle_home" gtk-mac-bundler \
            "$GITHUB_WORKSPACE/gnucash-on-osx/gnucash-bundler/gnucash-unstable.bundle"

      - name: Verify GTK4 app bundle
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/gnucash-bundle-home/.Gnucash.app"
          links="$RUNNER_TEMP/gnucash-bundle-otool.txt"

          test -d "$app"
          test -x "$app/Contents/MacOS/Gnucash"
          test -f "$app/Contents/Resources/etc/gtk-4.0/settings.ini"

          forbidden="$(find "$app/Contents" \
            \( -ipath '*gtk-3.0*' -o -iname '*gtk3*' -o -iname '*gtk-3*' -o -iname '*webkit2gtk*' \) \
            -print -quit)"
          if test -n "$forbidden"; then
            echo "Unexpected GTK3 or WebKitGTK payload: $forbidden" >&2
            exit 1
          fi

          : > "$links"
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              otool -L "$binary" >> "$links"
            fi
          done < <(find "$app/Contents" -type f \( -perm -111 -o -name '*.dylib' \) -print0)

          grep -q 'libgtk-4' "$links"
          grep -q '/System/Library/Frameworks/WebKit.framework/' "$links"
          if grep -Eq 'libgtk-3|webkit2gtk' "$links"; then
            echo 'Unexpected GTK3 or WebKitGTK linkage in app bundle.' >&2
            exit 1
          fi

      - name: Smoke-test GTK4 app startup
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/gnucash-bundle-home/.Gnucash.app"
          runtime_home="$RUNNER_TEMP/gnucash-runtime-home"
          log="$RUNNER_TEMP/gnucash-bundle-startup.log"
          mkdir -p "$runtime_home"

          HOME="$runtime_home" "$app/Contents/MacOS/Gnucash" --nofile >"$log" 2>&1 &
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill -TERM "$app_pid" 2>/dev/null || true
              wait "$app_pid" || true
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 20); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid"
              exit 1
            fi
            sleep 1
          done

          kill -TERM "$app_pid"
          if wait "$app_pid"; then
            status=0
          else
            status=$?
          fi
          if test "$status" -ne 0 && test "$status" -ne 143; then
            exit "$status"
          fi
          trap - EXIT

      - name: Upload bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gtk4-bundle-preflight
          path: |
            ${{ runner.temp }}/gnucash-bundle-otool.txt
            ${{ runner.temp }}/gnucash-bundle-startup.log
          if-no-files-found: ignore
